name = "evm-lean"
version = "0.1.0"
defaultTargets = ["EvmLean", "EvmLogic", "Conformance", "conform", "Snapshot", "snapshot"]
testDriver = "EvmTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The executable EVM semantics. No Mathlib, no FFI, no `opaque`, no `partial`.
[[lean_lib]]
name = "EvmLean"
leanOptions = { linter.missingDocs = true }

# Generic program logic and proof library over the semantics: step lemmas, a frame-local
# program logic, Solidity idioms, gas monotonicity, abstract interpretation, tactics.
[[lean_lib]]
name = "EvmLogic"

# Unit tests: `#guard` checks evaluated at build time (`lake test`).
[[lean_lib]]
name = "EvmTest"

# Ethereum conformance-test runner (`lake exe conform`).
[[lean_lib]]
name = "Conformance"

[[lean_exe]]
name = "conform"
root = "Conformance.Main"
supportInterpreter = false

# Snapshots of deployed contracts: code, verified sources and reachable state at one block,
# fetched once over JSON-RPC and replayed offline (`lake exe snapshot`).
[[lean_lib]]
name = "Snapshot"

[[lean_exe]]
name = "snapshot"
root = "Snapshot.Main"
supportInterpreter = false
