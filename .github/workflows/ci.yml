name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust check
        run: scripts/check-trust.sh
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          test: true
      - name: Kernel-checked theorems
        run: lake build EvmLeanProofs
