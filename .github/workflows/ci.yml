name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue re-checks each pull request on top of the latest `main` before merging.
  merge_group:
# A new push to a pull request cancels its running check; `main` and queue runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust check
        run: scripts/check-trust.sh
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Lake decides what to rebuild from content hashes, so the build outputs of the last `main`
      # run make this one incremental. Saved from `main` only, restored everywhere.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            qedefi/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'qedefi/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'qedefi/lake-manifest.json') }}-
      # Root package (core + Std): EvmLean, EvmLogic, Conformance, Snapshot, then EvmTest.
      - name: Root package
        run: |
          lake build --wfail
          lake test
      # The `qedefi` package (Mathlib): QEDefi, Verified, Examples, Difftest.
      - name: DeFi package
        working-directory: qedefi
        run: |
          lake exe cache get
          lake build --wfail
      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            qedefi/.lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
