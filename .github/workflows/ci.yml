name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust check
        run: scripts/check-trust.sh
      # Root package (core + Std): EvmLean, EvmLogic, Conformance (default targets), then
      # `lake test` (EvmTest).
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          test: true
      # The `qedefi` package (Mathlib): QEDefi, Examples, difftest.
      - name: DeFi package
        working-directory: qedefi
        run: |
          lake exe cache get
          lake build --wfail
