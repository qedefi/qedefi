name = "qedefi"
version = "0.1.0"
defaultTargets = ["QEDefi", "Examples", "difftest"]
testDriver = "QEDefiTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Proof files share `variable` blocks; unused instance arguments are harmless here.
linter.unusedSectionVars = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "evm-lean"
path = ".."

# Reusable DeFi verification kits (Mathlib): ERC-20 and ERC-4626 models, their properties,
# and EVM-independent refinement lifting.
[[lean_lib]]
name = "QEDefi"

# Worked examples: small demos, the Solmate and OpenZeppelin contracts, differential testing.
[[lean_lib]]
name = "Examples"

# `#guard` evaluation tests (contract constants, Solidity layer, string getters); `lake test`.
# Kept out of the proof libraries so that their build does not run the evaluations.
[[lean_lib]]
name = "QEDefiTest"

# Differential testing of compiled contracts: evm-lean vs. Foundry (`lake exe difftest`).
[[lean_exe]]
name = "difftest"
root = "Examples.Differential.Main"
